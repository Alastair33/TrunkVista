name: Release

# Runs when a tag such as v1.2.0 (or v1.2.0-rc.1 for a pre-release) is pushed - packaging/release.sh makes and pushes that tag.
# Builds the .deb, installs it for real on the runner as a test, and publishes it on the GitHub Releases page together with
# SHA256SUMS (and SHA256SUMS.sig when you have set up signing - see README.md). channelview-update on the servers installs from there.
# People who download ChannelView are sent to the LATEST release (README.md, "Download"), never to the branch: besides the versioned
# .deb every release carries channelview-latest.deb, channelview.py and channelview_demo.html under fixed names, so that
#   https://github.com/<owner>/<repository>/releases/latest/download/<name>
# always serves the newest full release (GitHub leaves pre-releases out of "latest").
on:
  push:
    tags: ['v*']

permissions:
  contents: write      # create the release

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match VERSION and CHANGELOG.md
        run: |
          version="$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' channelview.py | head -n1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME but channelview.py says VERSION = \"$version\". Use packaging/release.sh to make releases."
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: The standalone demo page matches the dashboard page
        run: |
          python3 tools/build_demo.py "$RUNNER_TEMP/demo.html"
          diff -q "$RUNNER_TEMP/demo.html" channelview_demo.html

      - name: Build the .deb
        env:
          DEB_MAINTAINER: "${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
        run: ./packaging/build_deb.sh      # GITHUB_REPOSITORY is set by Actions: it ends up in /etc/default/channelview

      - name: Lintian (errors fail the release)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lintian
          lintian --fail-on error dist/*.deb

      - name: Install, upgrade, update, remove and purge it for real
        run: sudo ./tests/e2e_debian.sh dist/channelview_*_all.deb

      - name: Collect the release files and checksums
        run: |
          # exactly one versioned .deb: the e2e test above has installed it, the fixed-name copy is made only now. The copy is called
          # channelview-latest.deb (not ..._all.deb) so that channelview-update, which looks for channelview_<version>_all.deb, ignores it.
          set -- dist/channelview_*_all.deb
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "::error::expected exactly one dist/channelview_*_all.deb, found: $*"; exit 1; }
          cp -- "$1" dist/channelview-latest.deb
          cp channelview.py channelview_demo.html dist/
          cd dist
          sha256sum -- *.deb channelview.py channelview_demo.html > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS (only if the signing secrets exist)
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if [ -z "$RELEASE_GPG_PRIVATE_KEY" ]; then
            echo "No RELEASE_GPG_PRIVATE_KEY secret: publishing without a signature (SHA256SUMS only)."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; install -d -m 0700 "$GNUPGHOME"
          printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "${RELEASE_GPG_PASSPHRASE:-}" \
              --detach-sign --output dist/SHA256SUMS.sig dist/SHA256SUMS
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"
          echo "signed: dist/SHA256SUMS.sig"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) found = 1; next }
            found
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          {
            echo
            echo "---"
            echo "Install:  \`sudo apt install ./channelview-latest.deb\`   -   update later with:  \`sudo channelview-update\`"
            echo
            echo "Files: \`channelview-latest.deb\` (the same package as \`channelview_${VERSION}_all.deb\`), \`channelview.py\` (the single program file, for systems without apt), \`channelview_demo.html\`, \`SHA256SUMS\`."
            echo "Always download from the newest release: https://github.com/${GITHUB_REPOSITORY}/releases/latest - not from the branch, which can hold unreleased changes."
          } >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
